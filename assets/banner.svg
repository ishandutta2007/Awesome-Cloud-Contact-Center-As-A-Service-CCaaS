    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 50; }
      }

      @keyframes signal {
        0% { r: 4px; opacity: 1; }
        100% { r: 28px; opacity: 0; }
      }

      .floating-node { animation: float 6s ease-in-out infinite; }
      .floating-node-delayed { animation: float 7s ease-in-out 2s infinite; }
      .pulse-wire { stroke-dasharray: 8, 8; animation: pulse 4s linear infinite; }
      .signal-ring { animation: signal 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .signal-ring-delayed { animation: signal 2.5s cubic-bezier(0, 0.2, 0.8, 1) 1.25s infinite; }
    </style>
  </defs>

